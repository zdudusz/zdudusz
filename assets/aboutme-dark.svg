  <text x="420" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9198a1">eduardo@limoeiro: ~</text>
  <text x="32" y="76" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">eduardo@limoeiro</tspan><tspan fill="#9198a1">:</tspan><tspan fill="#4493f8" font-weight="700">~</tspan><tspan fill="#9198a1">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
  <text x="32" y="113" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="700" fill="#e6edf3">Eduardo Souza</text>
  <text x="32" y="139" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#a371f7" font-weight="700">Back-end developer</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#9198a1">·</tspan><tspan fill="#e6edf3"> C# / .NET </tspan><tspan fill="#9198a1">·</tspan><tspan fill="#e6edf3"> Limoeiro, PE, Brazil</tspan></text>
  <text x="32" y="174" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#9198a1">&gt;</tspan><tspan fill="#e6edf3"> I'm a </tspan><tspan fill="#a371f7" font-weight="700">3rd-semester Information Systems student</tspan><tspan fill="#e6edf3"> at </tspan><tspan fill="#a371f7" font-weight="700">UPE</tspan><tspan fill="#e6edf3">,</tspan></text>
  <text x="32" y="197" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  the University of Pernambuco, focused on back-end with </tspan><tspan fill="#a371f7" font-weight="700">C#</tspan><tspan fill="#e6edf3"> and </tspan><tspan fill="#a371f7" font-weight="700">.NET</tspan><tspan fill="#e6edf3">.</tspan></text>
  <text x="32" y="230" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#9198a1">&gt;</tspan><tspan fill="#e6edf3"> Born and raised in </tspan><tspan fill="#a371f7" font-weight="700">Limoeiro, Pernambuco</tspan><tspan fill="#e6edf3">, in the northeast of Brazil,</tspan></text>
  <text x="32" y="253" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  where I currently work at </tspan><tspan fill="#a371f7" font-weight="700">OngoldTech</tspan><tspan fill="#e6edf3">.</tspan></text>
  <text x="32" y="286" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#9198a1">&gt;</tspan><tspan fill="#e6edf3"> Besides college, I keep learning on my own with </tspan><tspan fill="#a371f7" font-weight="700">DIO</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a371f7" font-weight="700">Udemy</tspan><tspan fill="#e6edf3"> and </tspan><tspan fill="#a371f7" font-weight="700">YouTube</tspan><tspan fill="#e6edf3">,</tspan></text>
  <text x="32" y="309" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  and I build landing pages for local businesses as a freelancer.</tspan></text>
  <text x="32" y="342" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#9198a1">&gt;</tspan><tspan fill="#e6edf3"> Off the keyboard: </tspan><tspan fill="#a371f7" font-weight="700">jiu-jitsu</tspan><tspan fill="#e6edf3"> (blue belt), </tspan><tspan fill="#a371f7" font-weight="700">basketball</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a371f7" font-weight="700">trap</tspan><tspan fill="#e6edf3"> on repeat</tspan></text>
  <text x="32" y="365" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  and way too much </tspan><tspan fill="#a371f7" font-weight="700">coffee</tspan><tspan fill="#e6edf3">.</tspan></text>
  <text x="32" y="406" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">eduardo@limoeiro</tspan><tspan fill="#9198a1">:</tspan><tspan fill="#4493f8" font-weight="700">~</tspan><tspan fill="#9198a1">$ </tspan><tspan fill="#e6edf3">echo $MOTTO</tspan></text>
  <text x="32" y="431" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#ffa657" font-style="italic">"Nothing like a day after another day."</tspan></text>
  <text x="32" y="466" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">eduardo@limoeiro</tspan><tspan fill="#9198a1">:</tspan><tspan fill="#4493f8" font-weight="700">~</tspan><tspan fill="#9198a1">$ </tspan><tspan fill="#e6edf3"></tspan><tspan class="cursor" fill="#e6edf3">█</tspan></text>
