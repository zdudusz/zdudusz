<svg xmlns="http://www.w3.org/2000/svg" width="840" height="496" viewBox="0 0 840 496" role="img" aria-label="whoami: Eduardo Souza, back-end developer (C# / .NET), Information Systems student at UPE, from Limoeiro, PE">
  <title>whoami: Eduardo Souza, back-end developer (C# / .NET), Information Systems student at UPE, from Limoeiro, PE</title>
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" width="839" height="495" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M0.5 40 V12.5 A12 12 0 0 1 12.5 0.5 H827.5 A12 12 0 0 1 839.5 12.5 V40 Z" fill="#f6f8fa"/>
