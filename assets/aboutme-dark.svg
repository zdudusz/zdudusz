<svg xmlns="http://www.w3.org/2000/svg" width="840" height="496" viewBox="0 0 840 496" role="img" aria-label="whoami: Eduardo Souza, back-end developer (C# / .NET), Information Systems student at UPE, from Limoeiro, PE">
