  <circle cx="22" cy="20.5" r="6" fill="#ff5f57"/><circle cx="42" cy="20.5" r="6" fill="#febc2e"/><circle cx="62" cy="20.5" r="6" fill="#28c840"/>
  <text x="420" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#59636e">eduardo@limoeiro: ~</text>
  <text x="32" y="76" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#1a7f37" font-weight="700">eduardo@limoeiro</tspan><tspan fill="#59636e">:</tspan><tspan fill="#0969da" font-weight="700">~</tspan><tspan fill="#59636e">$ </tspan><tspan fill="#1f2328">whoami</tspan></text>
  <text x="32" y="113" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="700" fill="#1f2328">Eduardo Souza</text>
  <text x="32" y="139" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#8250df" font-weight="700">Back-end developer</tspan><tspan fill="#1f2328"> </tspan><tspan fill="#59636e">·</tspan><tspan fill="#1f2328"> C# / .NET </tspan><tspan fill="#59636e">·</tspan><tspan fill="#1f2328"> Limoeiro, PE, Brazil</tspan></text>
  <text x="32" y="174" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#59636e">&gt;</tspan><tspan fill="#1f2328"> I'm a </tspan><tspan fill="#8250df" font-weight="700">3rd-semester Information Systems student</tspan><tspan fill="#1f2328"> at </tspan><tspan fill="#8250df" font-weight="700">UPE</tspan><tspan fill="#1f2328">,</tspan></text>
  <text x="32" y="197" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#1f2328">  the University of Pernambuco, focused on back-end with </tspan><tspan fill="#8250df" font-weight="700">C#</tspan><tspan fill="#1f2328"> and </tspan><tspan fill="#8250df" font-weight="700">.NET</tspan><tspan fill="#1f2328">.</tspan></text>
  <text x="32" y="230" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#59636e">&gt;</tspan><tspan fill="#1f2328"> Born and raised in </tspan><tspan fill="#8250df" font-weight="700">Limoeiro, Pernambuco</tspan><tspan fill="#1f2328">, in the northeast of Brazil,</tspan></text>
  <text x="32" y="253" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#1f2328">  where I currently work at </tspan><tspan fill="#8250df" font-weight="700">OngoldTech</tspan><tspan fill="#1f2328">.</tspan></text>
  <text x="32" y="286" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#59636e">&gt;</tspan><tspan fill="#1f2328"> Besides college, I keep learning on my own with </tspan><tspan fill="#8250df" font-weight="700">DIO</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#8250df" font-weight="700">Udemy</tspan><tspan fill="#1f2328"> and </tspan><tspan fill="#8250df" font-weight="700">YouTube</tspan><tspan fill="#1f2328">,</tspan></text>
  <text x="32" y="309" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#1f2328">  and I build landing pages for local businesses as a freelancer.</tspan></text>
  <text x="32" y="342" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#59636e">&gt;</tspan><tspan fill="#1f2328"> Off the keyboard: </tspan><tspan fill="#8250df" font-weight="700">jiu-jitsu</tspan><tspan fill="#1f2328"> (blue belt), </tspan><tspan fill="#8250df" font-weight="700">basketball</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#8250df" font-weight="700">trap</tspan><tspan fill="#1f2328"> on repeat</tspan></text>
  <text x="32" y="365" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#1f2328">  and way too much </tspan><tspan fill="#8250df" font-weight="700">coffee</tspan><tspan fill="#1f2328">.</tspan></text>
  <text x="32" y="406" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#1a7f37" font-weight="700">eduardo@limoeiro</tspan><tspan fill="#59636e">:</tspan><tspan fill="#0969da" font-weight="700">~</tspan><tspan fill="#59636e">$ </tspan><tspan fill="#1f2328">echo $MOTTO</tspan></text>
  <text x="32" y="431" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#953800" font-style="italic">"Nothing like a day after another day."</tspan></text>
  <text x="32" y="466" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#1a7f37" font-weight="700">eduardo@limoeiro</tspan><tspan fill="#59636e">:</tspan><tspan fill="#0969da" font-weight="700">~</tspan><tspan fill="#59636e">$ </tspan><tspan fill="#1f2328"></tspan><tspan class="cursor" fill="#1f2328">█</tspan></text>
